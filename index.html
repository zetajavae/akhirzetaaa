<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyZodiac</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    html{
      scroll-behavior:smooth;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050816;
      color:white;
      font-family:'Poppins',sans-serif;
      overflow-x:hidden;
    }

    /* BACKGROUND */

    body::before{
      content:'';
      position:fixed;
      width:100%;
      height:100%;

      background:
      linear-gradient(
      rgba(2,3,20,0.75),
      rgba(2,3,20,0.95)),
      url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000');

      background-size:cover;
      background-position:center;

      z-index:-2;
    }

    body::after{
      content:'';
      position:fixed;
      width:100%;
      height:100%;

      background:
      radial-gradient(circle at top,
      rgba(109,40,217,0.25),
      transparent 40%);

      z-index:-1;
    }

    /* NAVBAR */

    header{
      width:100%;
      padding:25px 8%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      position:fixed;
      top:0;
      left:0;
      z-index:999;

      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(14px);

      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      font-family:'Cinzel',serif;
      color:#f5d57a;
      font-size:2rem;
      font-weight:700;
    }

    nav{
      display:flex;
      gap:35px;
      align-items:center;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-size:15px;
      transition:0.3s;
      position:relative;
    }

    nav a:hover{
      color:#f5d57a;
    }

    nav a::after{
      content:'';
      position:absolute;
      left:0;
      bottom:-8px;

      width:0%;
      height:1px;

      background:#f5d57a;

      transition:0.4s;
    }

    nav a:hover::after{
      width:100%;
    }

    .login-btn{
      padding:12px 28px;
      border-radius:14px;

      background:
      linear-gradient(to right,#f5d57a,#ff4ecd);

      color:black;
      font-weight:700;
    }

    /* HERO */

    .hero{
      min-height:100vh;

      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:140px 8% 80px;
      gap:60px;
      flex-wrap:wrap;
    }

    .hero-left{
      max-width:650px;
    }

    .hero-left .welcome{
      color:#f5d57a;
      letter-spacing:5px;
      font-size:14px;
    }

    .hero-left h1{
      font-size:5.5rem;
      line-height:1.1;

      margin-top:25px;

      font-family:'Cinzel',serif;
      font-weight:700;
    }

    .hero-left h1 span{
      background:linear-gradient(to right,#f5d57a,#ff4ecd,#8b5cf6);

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-left p{
      margin-top:30px;
      color:#ddd;
      line-height:2;
      font-size:17px;
      max-width:550px;
    }

    .btn{
      display:inline-block;

      margin-top:40px;

      padding:18px 42px;

      border-radius:16px;

      background:
      linear-gradient(to right,#f5d57a,#ff4ecd);

      color:black;
      text-decoration:none;
      font-weight:700;

      transition:0.4s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    /* HERO RIGHT */

    .hero-right{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .hero-right img{
      width:420px;
      max-width:100%;

      animation:rotate 35s linear infinite;

      filter:
      drop-shadow(0 0 30px rgba(245,213,122,0.7))
      drop-shadow(0 0 70px rgba(255,0,200,0.25));
    }

    @keyframes rotate{

      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }

    }

    /* SECTION */

    section{
      padding:120px 8%;
    }

    .section-title{
      text-align:center;
      margin-bottom:70px;

      font-size:55px;

      color:#f5d57a;

      font-family:'Cinzel',serif;
    }

    /* ZODIAC */

    .zodiac-grid{
      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(260px,1fr));

      gap:35px;
    }

    .zodiac-card{
      background:rgba(10,10,25,0.75);

      border:1px solid rgba(255,255,255,0.1);

      border-radius:25px;

      padding:35px;

      text-align:center;

      backdrop-filter:blur(12px);

      transition:0.4s;
    }

    .zodiac-card:hover{
      transform:translateY(-10px);

      border-color:#f5d57a;

      box-shadow:
      0 0 40px rgba(255,0,200,0.2);
    }

    .zodiac-card img{
      width:120px;
      margin-bottom:20px;
      transition:0.4s;
    }

    .zodiac-card:hover img{
      transform:scale(1.1);
    }

    .zodiac-card h3{
      font-size:32px;
      margin-bottom:15px;

      color:#f5d57a;

      font-family:'Cinzel',serif;
    }

    .zodiac-card p{
      color:#ddd;
      line-height:1.8;
    }

    /* ABOUT */

    .about-content{
      display:flex;
      align-items:center;
      gap:50px;
      flex-wrap:wrap;
    }

    .about-content img{
      width:500px;
      max-width:100%;
      border-radius:25px;
    }

    .about-text{
      flex:1;
    }

    .about-text h3{
      font-size:45px;
      margin-bottom:20px;

      color:#f5d57a;

      font-family:'Cinzel',serif;
    }

    .about-text p{
      color:#ddd;
      line-height:2;
      font-size:17px;
    }

    /* GALLERY */

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:30px;
    }

    .gallery-grid img{
      width:100%;
      height:350px;
      object-fit:cover;

      border-radius:25px;

      transition:0.4s;
    }

    .gallery-grid img:hover{
      transform:scale(1.03);
    }

    iframe{
      width:100%;
      border:none;
      border-radius:25px;
    }

    /* LOGIN */

    .login-section{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:100%;
      max-width:500px;

      background:rgba(10,10,25,0.75);

      border:1px solid rgba(255,255,255,0.1);

      border-radius:30px;

      padding:50px;

      backdrop-filter:blur(12px);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:30px;

      color:#f5d57a;

      font-family:'Cinzel',serif;
      font-size:42px;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:18px 20px;

      border:none;
      outline:none;

      border-radius:15px;

      background:rgba(255,255,255,0.08);

      color:white;
      font-size:15px;
    }

    .submit-btn{
      width:100%;

      padding:18px;

      border:none;
      border-radius:15px;

      background:
      linear-gradient(to right,#f5d57a,#ff4ecd);

      color:black;
      font-weight:700;
      font-size:16px;

      cursor:pointer;
    }

    footer{
      padding:70px 30px;

      text-align:center;

      border-top:1px solid rgba(255,255,255,0.1);

      background:#04040f;

      color:#aaa;
    }

    footer h3{
      color:#f5d57a;

      margin-bottom:20px;

      font-size:35px;

      font-family:'Cinzel',serif;
    }

    @media(max-width:1000px){

      nav{
        display:none;
      }

      .hero{
        flex-direction:column;
        text-align:center;
      }

      .hero-left h1{
        font-size:3.7rem;
      }

      .hero-right img{
        width:300px;
      }

      .section-title{
        font-size:40px;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <header>

    <div class="logo">
      ✧ MyZodiac ✧
    </div>

    <nav>
      <a href="#">Beranda</a>
      <a href="#zodiak">Zodiak</a>
      <a href="#tentang">Tentang</a>
      <a href="#gallery">Galeri</a>
      <a href="#maps">Lokasi</a>
      <a href="#login" class="login-btn">Login</a>
    </nav>

  </header>

  <!-- HERO -->

  <section class="hero">

    <div class="hero-left">

      <div class="welcome">
        WELCOME TO THE UNIVERSE
      </div>

      <h1>
        Selamat Datang
        <br>
        di <span>Dunia Zodiak ✧</span>
      </h1>

      <p>
        Jelajahi kepribadian, energi, dan misteri dari setiap zodiak
        dengan nuansa galaksi aesthetic yang modern dan elegan.
      </p>

      <a href="#zodiak" class="btn">
        Jelajahi Zodiak
      </a>

    </div>

    <div class="hero-right">

      <img src="wheel.png">

    </div>

  </section>

  <!-- ZODIAK -->

  <section id="zodiak">

    <h2 class="section-title">
      12 Zodiak ✨
    </h2>

    <div class="zodiac-grid">
